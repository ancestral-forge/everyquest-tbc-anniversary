name: Sync GitLab mirror

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitlab
  cancel-in-progress: false

jobs:
  sync:
    name: Push Git refs to GitLab
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deleted == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitLab deploy key
        shell: bash
        env:
          GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$GITLAB_DEPLOY_KEY" ]]; then
            echo "GITLAB_DEPLOY_KEY is not configured" >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$GITLAB_DEPLOY_KEY" > ~/.ssh/gitlab_deploy_key
          chmod 600 ~/.ssh/gitlab_deploy_key
          cat >> ~/.ssh/known_hosts <<'EOF'
          gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf
          EOF

      - name: Push current refs
        shell: bash
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/gitlab_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          GITLAB_REPOSITORY: git@gitlab.com:ancestral-forge/everyquest-tbc-anniversary.git
        run: |
          set -euo pipefail

          git remote add gitlab "$GITLAB_REPOSITORY"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            case "${GITHUB_REF_TYPE}" in
              branch)
                git push gitlab "HEAD:refs/heads/${GITHUB_REF_NAME}"
                ;;
              tag)
                git push gitlab "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
                ;;
              *)
                echo "Unsupported ref type: ${GITHUB_REF_TYPE}" >&2
                exit 1
                ;;
            esac
            exit 0
          fi

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            --prune

          refspecs=()
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [[ "$branch" == "HEAD" ]] && continue
            refspecs+=("${ref}:refs/heads/${branch}")
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)
          refspecs+=('refs/tags/*:refs/tags/*')

          git push gitlab "${refspecs[@]}"
