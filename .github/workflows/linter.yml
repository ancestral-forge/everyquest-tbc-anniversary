name: Linter

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    name: Lua lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Luacheck and Lua 5.1 compatibility checks
        uses: ancestral-forge/luacheck@v1
        with:
          args: --codes
          custom_script: tools/check-lua51-compat.lua
          custom_args: .
          job_summary: true
