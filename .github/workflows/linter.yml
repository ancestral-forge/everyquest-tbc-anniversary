name: Linter

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    name: Lua lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Luacheck
        uses: ancestral-forge/luacheck@v1
        with:
          args: --codes
          job_summary: true

      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes lua5.1 libxml2-utils

      - name: Run repository validation gate
        run: tools/verify-addon.sh --skip-luacheck
