name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2026.3.1. Defaults to v<TOC version>."
        required: false
        type: string

permissions:
  contents: write

jobs:
  linter:
    uses: ./.github/workflows/linter.yml

  package:
    name: Package addon zip
    runs-on: ubuntu-latest
    needs: linter

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build release package
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi

          tools/package-release.sh "$tag"
          source dist/release.env

          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "asset=${RELEASE_ASSET}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          asset="${{ steps.release.outputs.asset }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/${asset}" "dist/${asset}.sha256" --clobber
          else
            gh release create "$tag" \
              "dist/${asset}" \
              "dist/${asset}.sha256" \
              --target "$GITHUB_SHA" \
              --title "${version}" \
              --notes-file dist/release-notes.md
          fi
