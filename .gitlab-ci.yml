stages:
  - test
  - release
  - sync

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+(\.[0-9]+)+$/'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

lua:
  stage: test
  image:
    name: ghcr.io/ancestral-forge/luacheck:v1
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+(\.[0-9]+)+$/'
      when: manual
      allow_failure: false
  script:
    - luacheck --codes .
    - lua5.1 tools/check-lua51-compat.lua .

openspec:
  stage: test
  image: node:24-alpine
  variables:
    OPENSPEC_TELEMETRY: "0"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+(\.[0-9]+)+$/'
      when: manual
      allow_failure: false
  script:
    - npx --yes @fission-ai/openspec@1.10.0 validate --all

publish-release:
  stage: release
  image: alpine:3.22
  needs:
    - lua
    - openspec
  resource_group: gitlab-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+(\.[0-9]+)+$/'
      when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache bash curl git jq zip
  script:
    - tools/publish-gitlab-release.sh "$CI_COMMIT_TAG"

sync-github:
  stage: sync
  image: alpine:3.22
  resource_group: github-sync
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache bash curl git jq zip
  script:
    - tools/sync-github-to-gitlab.sh
