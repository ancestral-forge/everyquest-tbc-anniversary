workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

sync-github:
  image: alpine:3.22
  resource_group: github-sync
  interruptible: false
  before_script:
    - apk add --no-cache bash curl git jq
  script:
    - tools/sync-github-to-gitlab.sh

